# BPF LSM version of policies/01: Override makes the open itself fail.
# Needs 'bpf' in /sys/kernel/security/lsm.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: lsm-block-token-read
  namespace: demo
spec:
  options:
    - name: policy-mode
      value: monitor
  podSelector:
    matchLabels:
      app: webapp
  lsmhooks:
    - hook: file_open
      args:
        - index: 0
          type: file
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                # /var/run is a symlink to /run in many images, and Tetragon
                # reports the resolved path, so both prefixes are needed.
                - /var/run/secrets/kubernetes.io/serviceaccount
                - /run/secrets/kubernetes.io/serviceaccount
          matchActions:
            - action: Override
              argError: -1
            - action: Sigkill
