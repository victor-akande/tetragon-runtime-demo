# BPF LSM version of policies/02: Override makes the connect itself fail.
# Needs 'bpf' in /sys/kernel/security/lsm.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: lsm-block-curl-download
  namespace: demo
spec:
  options:
    - name: policy-mode
      value: monitor
  podSelector:
    matchLabels:
      app: webapp
  lsmhooks:
    - hook: socket_connect
      args:
        - index: 0
          type: socket
        - index: 1
          type: sockaddr
      selectors:
        - matchBinaries:
            - operator: In
              values:
                - /usr/bin/curl
          matchCmdArgs:
            - index: 0
              operator: NotPrefix
              values:
                # The trailing slash stops ...:8080@attacker/ from passing.
                - "http://inventory.demo.svc.cluster.local:8080/"
          matchActions:
            - action: Override
              argError: -1
            - action: Sigkill
