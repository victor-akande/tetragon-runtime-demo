# BPF LSM version of policies/03: Override makes the exec itself fail.
# Needs 'bpf' in /sys/kernel/security/lsm.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: lsm-block-shell
  namespace: demo
spec:
  options:
    - name: policy-mode
      value: monitor
  podSelector:
    matchLabels:
      app: webapp
  lsmhooks:
    - hook: bprm_check_security
      args:
        - index: 0
          type: linux_binprm
      selectors:
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - /bin/sh
                - /usr/bin/sh
                - /bin/dash
                - /usr/bin/dash
                - /bin/bash
                - /usr/bin/bash
          matchActions:
            - action: Override
              argError: -1
            - action: Sigkill
