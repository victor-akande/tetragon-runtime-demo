# A sensible least-privilege policy for the webapp. Every step of the attack
# uses traffic it allows: inbound HTTP to the app and outbound HTTP.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: webapp
  namespace: demo
spec:
  endpointSelector:
    matchLabels:
      app: webapp
  ingress:
    - fromEntities: ["world", "cluster"]
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
  egress:
    # Internal dependency
    - toEndpoints:
        - matchLabels:
            app: inventory
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # "Partner APIs" on the internet
    - toEntities: ["world"]
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # "Partner network": the podman subnet where the attacker server lives.
    # Listed explicitly in case Cilium doesn't classify it as "world".
    - toCIDR:
        - 10.88.0.0/16
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Note: no egress to kube-apiserver. The pod cannot use the stolen
    # token itself, so the attacker exfiltrates it and uses it from outside.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: inventory
  namespace: demo
spec:
  endpointSelector:
    matchLabels:
      app: inventory
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: webapp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
