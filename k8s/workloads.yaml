apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# The webapp's service account can read secrets in its namespace.
# This is the over-permissioned token the attacker will steal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webapp-read-secrets
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webapp-read-secrets
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: webapp
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webapp-read-secrets
---
apiVersion: v1
kind: Secret
metadata:
  name: payments-api-key
  namespace: demo
type: Opaque
stringData:
  api-key: "sk_live_DEMO_ONLY_not_a_real_key"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      serviceAccountName: webapp
      containers:
        - name: webapp
          image: netcheck:demo
          imagePullPolicy: Never   # loaded into kind by setup/install.sh
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: demo
spec:
  selector:
    app: webapp
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      automountServiceAccountToken: false
      containers:
        - name: inventory
          image: python:3.12-slim
          command: ["sh", "-c", "mkdir -p /srv && echo ok > /srv/health && exec python -m http.server 8080 -d /srv"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: demo
spec:
  selector:
    app: inventory
  ports:
    - port: 8080
      targetPort: 8080
