# Layer 1: kill any process in the webapp pod that opens its service-account token.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: block-token-read
  namespace: demo
spec:
  options:
    - name: policy-mode
      value: monitor
  podSelector:
    matchLabels:
      app: webapp
  kprobes:
    - call: security_file_open
      syscall: false
      args:
        - index: 0
          type: file
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                # /var/run is a symlink to /run in many images, and Tetragon
                # reports the resolved path, so both prefixes are needed.
                - /var/run/secrets/kubernetes.io/serviceaccount
                - /run/secrets/kubernetes.io/serviceaccount
          matchActions:
            - action: Sigkill
