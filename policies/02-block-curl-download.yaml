# Layer 2: kill curl when it connects, unless its first argument is the
# inventory URL (the app's own /status call). Bypassable on purpose: see Act 4.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: block-curl-download
  namespace: demo
spec:
  options:
    - name: policy-mode
      value: monitor
  podSelector:
    matchLabels:
      app: webapp
  kprobes:
    - call: security_socket_connect
      syscall: false
      args:
        - index: 0
          type: socket
        - index: 1
          type: sockaddr
      selectors:
        - matchBinaries:
            - operator: In
              values:
                - /usr/bin/curl
          matchCmdArgs:
            - index: 0
              operator: NotPrefix
              values:
                # The trailing slash stops ...:8080@attacker/ from passing.
                - "http://inventory.demo.svc.cluster.local:8080/"
          matchActions:
            - action: Sigkill
