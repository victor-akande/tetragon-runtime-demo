# Layer 3: stop any shell from starting in the webapp pod.
# While enforcing, `kubectl exec ... -- sh` into the pod fails too.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: block-shell
  namespace: demo
spec:
  options:
    - name: policy-mode
      value: monitor
  podSelector:
    matchLabels:
      app: webapp
  kprobes:
    - call: security_bprm_check
      syscall: false
      args:
        - index: 0
          type: linux_binprm
      selectors:
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - /bin/sh
                - /usr/bin/sh
                - /bin/dash
                - /usr/bin/dash
                - /bin/bash
                - /usr/bin/bash
          matchActions:
            - action: Sigkill
