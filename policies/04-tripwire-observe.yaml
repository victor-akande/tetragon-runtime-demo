# Layer 4a: tripwire, observe only. Reading the decoy credentials sets
# "tripped", after which every connect() from the pod is reported.
# The state is shared by the whole policy; reset it with
# scripts/policy.sh reset-tripwire.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: tripwire-observe
  namespace: demo
spec:
  podSelector:
    matchLabels:
      app: webapp
  state:
    - name: tripped
  kprobes:
    - call: security_file_open
      syscall: false
      args:
        - index: 0
          type: file
      selectors:
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - /app/.aws/credentials
          matchActions:
            - action: UpdateState
              state:
                name: tripped
                operator: Set
                value: "1"
            - action: Post
    - call: security_socket_connect
      syscall: false
      args:
        - index: 0
          type: socket
        - index: 1
          type: sockaddr
      selectors:
        - matchStates:
            - name: tripped
              operator: Equal
              value: "1"
          matchActions:
            - action: Post
