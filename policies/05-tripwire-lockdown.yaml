# Layer 4b: 04-tripwire-observe.yaml plus Sigkill. Once tripped, every connect()
# from the pod is killed, the app's own included, until reset-tripwire.
# Don't apply it together with 04.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: tripwire-lockdown
  namespace: demo
spec:
  podSelector:
    matchLabels:
      app: webapp
  state:
    - name: tripped
  kprobes:
    - call: security_file_open
      syscall: false
      args:
        - index: 0
          type: file
      selectors:
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - /app/.aws/credentials
          matchActions:
            - action: UpdateState
              state:
                name: tripped
                operator: Set
                value: "1"
            - action: Post
    - call: security_socket_connect
      syscall: false
      args:
        - index: 0
          type: socket
        - index: 1
          type: sockaddr
      selectors:
        - matchStates:
            - name: tripped
              operator: Equal
              value: "1"
          matchActions:
            - action: Post
            - action: Sigkill
